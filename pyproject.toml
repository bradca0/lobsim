[project]
name = "lobsim"
version = "0.1.0"
description = "Queue-aware limit order book simulator and market-making policy testbed"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Brad Cao" }]
dependencies = [
    "numpy==2.3.4",
    "scipy==1.16.3",
    "scikit-learn==1.7.2",
    "matplotlib==3.10.7",
    "pandas==2.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "hypothesis==6.142.5",
    "ruff==0.14.4",
    "mypy==1.18.2",
    "pandas-stubs==2.3.2.250926",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lobsim"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # comprehensions
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-specific
    "N",   # pep8-naming
    "ARG", # unused arguments
    "PTH", # use pathlib
    "NPY", # numpy-specific
]
ignore = [
    "E501",    # line length handled by formatter
    "N803",    # allow math-style arg names (N, T, X)
    "N806",    # allow math-style locals (X, Q)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = []
mypy_path = "src"
packages = ["lobsim"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
filterwarnings = ["error::RuntimeWarning"]

[tool.coverage.run]
branch = true
source = ["src/lobsim"]
omit = ["src/lobsim/plotting.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
]
