name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # A virtual environment, not `--system`: the runner's interpreters are externally managed
      # (PEP 668), so a system install is refused outright. This also matches what `make setup`
      # does locally, so CI exercises the documented workflow rather than a parallel one.
      - name: Install project
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy

      - name: Tests
        run: uv run pytest --cov=lobsim --cov-report=term-missing --cov-fail-under=85
